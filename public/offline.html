<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f252b">
    <title>You are offline</title>
    <style>
        /* Self-contained on purpose: this page is shown when nothing else can be loaded. */
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; align-items: center; justify-content: center; padding: 1.5rem;
            padding-top: max(1.5rem, env(safe-area-inset-top)); padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
            background: #1f252b; color: #1e293b; font: 15px/1.5 'Segoe UI', 'Helvetica Neue', Arial, Roboto, system-ui, sans-serif;
        }
        main { width: 100%; max-width: 26rem; padding: 1.75rem; border-top: 4px solid #1f5a8f; border-radius: 4px; background: #fff; }
        h1 { margin: 0 0 .5rem; font-size: 1.3rem; }
        p { margin: 0 0 .9rem; color: #475569; }
        ul { margin: 0 0 1.25rem; padding-left: 1.1rem; color: #475569; }
        button {
            min-height: 44px; padding: .5rem 1.25rem; border: 0; border-radius: 4px; background: #1f5a8f; color: #fff;
            font: inherit; font-weight: 600; cursor: pointer;
        }
        button:focus-visible { outline: 2px solid #d98a00; outline-offset: 2px; }
        .status { margin-top: .9rem; font-size: .85rem; color: #64748b; }
    </style>
</head>
<body>
    <main>
        <h1>You are offline</h1>
        <p>FormEzy shows live records, so this page needs a connection.</p>
        <ul>
            <li>Nothing you were typing has been saved.</li>
            <li>Check your Wi-Fi or mobile data, then try again.</li>
            <li>When the connection comes back this page opens the app by itself.</li>
        </ul>
        <button type="button" id="retry">Try again</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
        // Back to where the person was going (or the start page) as soon as the network is back.
        var target = location.pathname.replace(/offline\.html$/, '');
        var status = document.getElementById('status');

        function retry() {
            status.textContent = 'Checking the connection…';
            fetch(target, { method: 'HEAD', cache: 'no-store' })
                .then(function () { location.replace(document.referrer && new URL(document.referrer).origin === location.origin ? document.referrer : target); })
                .catch(function () { status.textContent = 'Still offline.'; });
        }

        document.getElementById('retry').addEventListener('click', retry);
        window.addEventListener('online', retry);
    </script>
</body>
</html>
